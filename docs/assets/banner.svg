  <rect x="96" y="460" width="146" height="40" rx="20" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.55"/><text x="169.0" y="486.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Helm + kind</text>
  <rect x="254" y="460" width="197" height="40" rx="20" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185" stroke-opacity="0.55"/><text x="352.5" y="486.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Trivy + gitleaks</text>
  <rect x="463" y="460" width="177" height="40" rx="20" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.55"/><text x="551.5" y="486.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">GitHub Actions</text>
  <rect x="96" y="512" width="237" height="40" rx="20" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.55"/><text x="214.5" y="538.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Agent skills &amp; hooks</text>
  <rect x="345" y="512" width="217" height="40" rx="20" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.55"/><text x="453.5" y="538.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Repo score 100/100</text>

