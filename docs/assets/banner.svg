<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">ShipShape</title>
  <desc id="d">ShipShape, the agent-ready full-stack starter template for full-stack, cloud-native apps: CI gate, security scanning, tests, agent skills and hooks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#131c3b"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Mark: a ship under full sail, checked off as ready -->
  <g transform="translate(96 92)">
    <rect width="132" height="132" rx="30" fill="#0b1224" stroke="url(#road)" stroke-width="3"/>
    <path d="M68 24 L68 90 L104 90 Z" fill="url(#road)"/>
    <path d="M61 38 L61 90 L33 90 Z" fill="url(#road)" fill-opacity="0.7"/>
    <path d="M24 98 L110 98 L97 114 L37 114 Z" fill="#34d399"/>
    <circle cx="104" cy="32" r="13" fill="#0b1224" stroke="#34d399" stroke-width="3"/>
    <path d="M98 32 L102.5 36.5 L110.5 27.5" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="256" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="-2">ShipShape</text>
  <text x="260" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#a5b4fc">The agent-ready full-stack starter</text>

  <text x="96" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">Every PR shipshape, human or agent</text>
  <text x="96" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">CI gate · security scanning · real tests · PR hygiene · skills &amp; hooks</text>

