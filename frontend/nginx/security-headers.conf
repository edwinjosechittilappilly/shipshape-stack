# Included by default.conf.template. nginx drops inherited add_header directives as soon as a location declares its
# own (e.g. Cache-Control), so every such location includes this file again instead of repeating the list.
#
# The app is a same-origin SPA with no inline scripts, so the CSP can be strict; style-src allows inline styles only
# because React may set style attributes.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
