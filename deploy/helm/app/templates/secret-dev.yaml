{{- if not .Values.database.existingSecret }}
{{- $url := required "Set database.existingSecret (recommended) or database.url (dev only)." .Values.database.url }}
# DEV ONLY: chart-managed Secret. It is a pre-install hook so it exists before the migration
# Job runs; as a hook it is not deleted by `helm uninstall`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.databaseSecretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: dev-only
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  database-url: {{ $url | quote }}
{{- end }}
