{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Least-privilege rules. Pair with a default-deny policy in the namespace (see infra/terraform/modules/namespace).
# Frontend: accepts traffic from the ingress controller, talks only to the backend (and DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-frontend
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: {{ .Values.frontend.port }}, protocol: TCP}
      {{- with $np.ingressNamespaceSelector }}
      from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 16 }}
        # Same-namespace clients (the helm test pod) are allowed too.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 16 }}
      ports:
        - {port: {{ .Values.backend.port }}, protocol: TCP}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# Backend: accepts traffic from the frontend only; talks to DNS and the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-backend
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
      ports:
        - {port: {{ .Values.backend.port }}, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: {{ $np.databasePort }}, protocol: TCP}
      {{- with $np.databaseTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Short-lived clients: the migration Job (needs the database) and the helm test pod (needs the frontend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-jobs
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name | quote }}]}
      - {key: app.kubernetes.io/component, operator: In, values: [migrate, test]}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: {{ $np.databasePort }}, protocol: TCP}
      {{- with $np.databaseTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 16 }}
      ports:
        - {port: {{ .Values.frontend.port }}, protocol: TCP}
{{- end }}
