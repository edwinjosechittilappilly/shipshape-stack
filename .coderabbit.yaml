# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review profile. It is an *advisory* reviewer: humans approve, `ci-success` gates merge.
# The path instructions encode this repo's conventions (docs/conventions.md) so the bot reviews against them, not generic taste.
language: en-US
tone_instructions: >-
  Be direct, specific, and kind. Lead with correctness and security issues, cite the file and line, and suggest a concrete fix.
  Mark optional remarks as nits. Do not praise, do not restate the diff, and stay silent when there is nothing to flag.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  assess_linked_issues: true
  auto_title_instructions: "Conventional Commits `type(scope)!: subject`, lower-case subject, at most 72 characters."

  # Generated or machine-written files add noise and no signal.
  path_filters:
    - "!**/package-lock.json"
    - "!**/uv.lock"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/playwright-report/**"
    - "!**/test-results/**"
    - "!**/*.min.*"
    - "!**/__snapshots__/**"
    - "!CHANGELOG.md"

  path_instructions:
    - path: "backend/src/**/*.py"
      instructions: |
        FastAPI + SQLAlchemy 2 + psycopg 3. Check: routes stay thin (no business logic or SQL in handlers); response models and
        status codes are explicit; all I/O is typed (mypy strict); config comes from the settings object, never `os.environ`
        scattered around; logging via the standard logger with structured context and never secrets or PII; errors map to
        correct HTTP codes with `{"detail": ...}`; no blocking calls in async paths; public API changes are versioned under /api/v1.
    - path: "backend/**/migrations/**"
      instructions: |
        Alembic migrations. Must be backwards compatible with the previous app release (expand/contract: add nullable or defaulted
        columns first, drop later). Flag long locks (non-concurrent index builds on big tables, table rewrites), data loss,
        missing downgrade, edits to an already-merged migration, and autogenerated noise. Migrations run as a separate step, never at app start.
    - path: "backend/tests/**"
      instructions: |
        Tests must be deterministic, behaviour-focused, and have one reason to fail. Flag sleeps, order dependence, real network
        calls, assertions on implementation details, over-mocking of the code under test, and integration tests that do not use the real database.
    - path: "frontend/src/**"
      instructions: |
        React 19 + TypeScript strict. Check accessibility first (labels, roles, keyboard, focus), then state and effects
        (derived state, missing deps, effect used for data that should be computed), error and loading states, and that API
        calls use relative `/api/...` URLs. No `any`, no non-null assertions to silence the compiler, no inline secrets or hard-coded hosts.
    - path: "frontend/**/*.{test,spec}.{ts,tsx}"
      instructions: |
        Query by accessible role and name (Testing Library), assert user-visible behaviour, no snapshot of large trees, no fixed
        timeouts. Playwright specs must use web-first assertions and stay deterministic.
    - path: "frontend/e2e/**"
      instructions: |
        Playwright. `mocked` project stubs the API with page.route; `fullstack` hits the real stack and must create and clean up its own data.
        Prefer role/label locators over CSS selectors; no `waitForTimeout`.
    - path: ".github/workflows/**"
      instructions: |
        Security first. Actions must be pinned by full commit SHA with a `# vX.Y.Z` comment; `permissions:` must be least-privilege
        and set per job; untrusted input (PR title, branch name, comments) must never be interpolated into `run:` (pass via env);
        `pull_request_target` must never check out or run PR code; secrets only where needed; CI calls `make` targets rather than
        duplicating commands; features needing GitHub Advanced Security are gated on public visibility. New jobs must be wired into `ci-success`.
    - path: "scripts/**"
      instructions: |
        Shell scripts: `set -euo pipefail`, quote expansions, pass shellcheck, no reliance on the caller's cwd. Python scripts: typed, stdlib-only where possible, with unit tests.
    - path: "deploy/helm/**"
      instructions: |
        Helm chart. Containers run non-root with `readOnlyRootFilesystem`, dropped capabilities, resource requests/limits,
        liveness on /healthz and readiness on /readyz, no secrets in values (reference a Secret), pinned image tags or digests, and
        the migration runs as a hook Job. Changes must keep `helm lint --strict` and `helm template` clean.
    - path: "infra/**"
      instructions: |
        Terraform/OpenTofu. Must stay valid for both tools. No hard-coded secrets or account identifiers, pinned provider and
        module versions, least-privilege IAM, encryption on by default, variables typed and described, outputs for sensitive values marked sensitive.
    - path: "**/Dockerfile"
      instructions: |
        Multi-stage, pinned base image, non-root numeric user, no secrets in layers, `.dockerignore` respected, minimal runtime image, deterministic dependency install from the lockfile.
    - path: "docker-compose.yml"
      instructions: "Local/CI stack only. Healthchecks on every service, no real secrets, migration is its own service."
    - path: ".agents/skills/**"
      instructions: |
        Agent skills. Each SKILL.md has front matter with `name` (matching the directory) and a `description` that says when to
        use it; the body is imperative, short, tool-agnostic, and references real repo paths and make targets. Flag stale
        commands, duplicated guidance that belongs in docs/, and instructions that bypass hooks or CI.
    - path: "docs/**"
      instructions: "Docs must match the code. Flag stale commands or paths, broken relative links, and decisions without an ADR or plan link. Keep prose concise."
    - path: "docs/adr/**"
      instructions: "Accepted ADRs are immutable except for status changes; flag edits to the decision and ask for a new superseding ADR instead."

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
    base_branches:
      - main

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/conventions.md
      - docs/testing.md
