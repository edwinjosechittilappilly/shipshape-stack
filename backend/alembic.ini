# Alembic configuration. The database URL is NOT set here: migrations/env.py reads DATABASE_URL
# through app.config, so the same variable drives the app, the tests and the migrate job.
[alembic]
# %(here)s makes this work from any cwd (local shell, container WORKDIR /app, Helm hook job).
script_location = %(here)s/migrations
# Sortable, readable file names: 0002_add_due_date.py
file_template = %%(rev)s_%%(slug)s
# The app is an installed package (uv sync), so no sys.path tweaks are needed.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
