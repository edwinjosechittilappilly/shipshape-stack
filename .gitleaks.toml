# gitleaks configuration (https://github.com/gitleaks/gitleaks).
# We extend the upstream default rule set rather than writing our own, so new secret patterns arrive with
# gitleaks upgrades. The allowlist is deliberately tiny: only files that are *meant* to contain fake credentials.
title = "shipshape-stack gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Example env files and test fixtures contain intentionally fake credentials (e.g. app:app)."
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)[^/]*\.env\.example$''',
  '''(^|/)tests?/fixtures/''',
  '''(^|/)__fixtures__/''',
]
