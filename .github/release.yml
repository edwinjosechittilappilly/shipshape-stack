# Categories for GitHub's auto-generated release notes (used by .github/workflows/release.yml via
# `gh release create --generate-notes`). PRs are bucketed by the `type:` label that pr-labeler.yml derives from the
# Conventional Commit title, so good titles are the changelog. First matching category wins.
changelog:
  exclude:
    authors:
      - github-actions
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - "type: feature"
    - title: Bug fixes
      labels:
        - "type: bug"
    - title: Security
      labels:
        - "type: security"
    - title: Performance
      labels:
        - "type: perf"
    - title: Documentation
      labels:
        - "type: docs"
    - title: Dependency updates
      labels:
        - dependencies
    - title: Maintenance and CI
      labels:
        - "type: chore"
        - "type: refactor"
        - "type: test"
        - "type: ci"
    - title: Other changes
      labels:
        - "*"
