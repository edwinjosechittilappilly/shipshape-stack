# Blank issues are disabled so every issue is one of the forms in this directory (the forms make issues
# pick-up-able by people and by coding agents). Security reports must NOT be filed as public issues.
blank_issues_enabled: false
contact_links:
  # TEMPLATE NOTE: after you generate a repo from this template, point this URL at your own repository.
  - name: Report a security vulnerability
    url: https://github.com/edwinjosechittilappilly/shipshape-stack/security/advisories/new
    about: Private disclosure. Please do not open a public issue. See SECURITY.md for the policy and response times.
