# Source of truth for repository labels. `.github/workflows/labels-sync.yml` applies this file (create or update;
# labels not listed here are left alone). Keep names in sync with:
#   - scripts/ci/pr_labels.py   (type, size and breaking labels are computed from the PR title and diff)
#   - .github/labeler.yml       (area labels are computed from changed paths)
#   - .github/release.yml       (release-note categories)
# Colors are hex without `#`. Prefixes group labels in the UI: `type:`, `area:`, `size/`, `status:`, `agent:`.

# --- type: set automatically from the Conventional Commit type in the PR title (never label these by hand) -------
- name: "type: feature"
  color: "0e8a16"
  description: "New user-facing capability (feat)"
- name: "type: bug"
  color: "d73a4a"
  description: "Fixes incorrect behaviour (fix)"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only (docs)"
- name: "type: chore"
  color: "cfd3d7"
  description: "Maintenance: chore, build, style, revert"
- name: "type: refactor"
  color: "5319e7"
  description: "Code change with no behaviour change (refactor)"
- name: "type: test"
  color: "fbca04"
  description: "Adds or fixes tests (test)"
- name: "type: ci"
  color: "1d76db"
  description: "CI, workflows and automation (ci)"
- name: "type: perf"
  color: "f9a825"
  description: "Performance improvement (perf)"
- name: "type: security"
  color: "b60205"
  description: "Security fix or hardening (security)"
- name: "breaking-change"
  color: "b60205"
  description: "Breaking change: `!` in the title or a BREAKING CHANGE footer"

# --- area: set automatically from the changed paths (.github/labeler.yml) ----------------------------------------
- name: "area: backend"
  color: "bfdadc"
  description: "backend/ (FastAPI service, migrations)"
- name: "area: frontend"
  color: "bfdadc"
  description: "frontend/ (React app, nginx)"
- name: "area: infra"
  color: "bfdadc"
  description: "deploy/, infra/, docker-compose.yml, Dockerfiles"
- name: "area: ci"
  color: "bfdadc"
  description: ".github/, scripts/ci/, scripts/security/"
- name: "area: docs"
  color: "bfdadc"
  description: "docs/ and Markdown at the repo root"
- name: "area: tests"
  color: "bfdadc"
  description: "Tests and test tooling"
- name: "area: agents"
  color: "bfdadc"
  description: "AGENTS.md, .agents/, hooks and agent configuration"

# --- size: exactly one is set automatically from changed lines, lockfiles and generated files excluded -----------
- name: "size/XS"
  color: "3cbf00"
  description: "Fewer than 10 changed lines"
- name: "size/S"
  color: "5d9801"
  description: "10 to 49 changed lines"
- name: "size/M"
  color: "7f7203"
  description: "50 to 199 changed lines"
- name: "size/L"
  color: "a14c05"
  description: "200 to 499 changed lines"
- name: "size/XL"
  color: "c32607"
  description: "500 or more changed lines: consider splitting"

# --- status: workflow state, set by humans or agents ---------------------------------------------------------------
- name: "status: needs-triage"
  color: "ededed"
  description: "New issue: needs a decision on priority and scope"
- name: "status: blocked"
  color: "e99695"
  description: "Waiting on something external (exempt from stale handling)"
- name: "status: needs-human"
  color: "d93f0b"
  description: "An agent or automation needs a person to decide or act; blocks auto-merge"
- name: "status: ready-to-merge"
  color: "0e8a16"
  description: "Approved to merge: enables auto-merge once required checks and reviews pass"

# --- agent: coordination between people and coding agents ----------------------------------------------------------
- name: "agent: ready"
  color: "c5def5"
  description: "Issue is well specified: an agent can pick it up"
- name: "agent: in-progress"
  color: "bfd4f2"
  description: "An agent is working on this (exempt from stale handling)"
- name: "agent: authored"
  color: "d4c5f9"
  description: "PR opened by a coding agent"
- name: "agent: review"
  color: "d4c5f9"
  description: "Request an AI review (runs .github/workflows/agent-review.yml)"

# --- misc ------------------------------------------------------------------------------------------------------------
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "run: kind-e2e"
  color: "fef2c0"
  description: "Opt in to the heavy kind cluster end-to-end CI job on this PR"
